
name: Build and Test (Dev Branch)

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  build-and-test:
    name: Build & Test

    runs-on: ubuntu-latest

    
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:

          version: '10.20.0'


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25.1.0'
          
          cache: 'pnpm'

   
      - name: Install dependencies
        run: pnpm install

      
      - name: Build project
        run: pnpm build

     
      - name: Run tests
        run: pnpm test
